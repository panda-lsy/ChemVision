<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="化学结构式智能生成、编辑与学习助手">

  <!-- 阻止 HTTP 层缓存本页面（微信内置浏览器等强缓存环境必需） -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #0d1627;
      overflow: hidden;
    }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ChemEdu">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>

  <title>ChemEdu</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- 微信等强缓存环境下，主动清理旧 Service Worker，确保拿到最新版本 -->
  <!-- 用 sessionStorage 防止死循环：每个标签页最多 reload 一次 -->
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      var KEY = '__cv_sw_cleaned__';
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        if (regs.length === 0) {
          sessionStorage.removeItem(KEY);
          return;
        }
        if (sessionStorage.getItem(KEY)) {
          // 已 reload 过一次，不再重复 reload，但后台仍清理残留 SW
          regs.forEach(function (r) { r.unregister(); });
          sessionStorage.removeItem(KEY);
          return;
        }
        sessionStorage.setItem(KEY, '1');
        Promise.all(regs.map(function (r) { return r.unregister(); }))
          .then(function () { location.reload(); })
          .catch(function () { sessionStorage.removeItem(KEY); });
      }).catch(function () {});
    })();
  </script>
</body>
</html>
