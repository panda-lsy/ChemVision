<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>ChemVISION - 启动页</title>
    <style>
        /* ── 设计变量（与 common.css 保持一致） ──────── */
        :root {
            --ink: #0b0f1a;
            --navy: #0f172a;
            --aqua: #38d5c1;
            --lime: #b7f171;
            --amber: #f6b355;
            --mist: #e9eef5;
            --glass: rgba(255, 255, 255, 0.08);
            --transition-ease: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            font-family: 'Space Grotesk', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }

        /* ── 手机模型 ──────────────────────────────── */
        .phone {
            position: relative;
            width: 390px;
            height: 780px;
            padding: 14px;
            border-radius: 44px;
            background: linear-gradient(165deg, #151b2a 0%, #0c111f 100%);
            box-shadow:
                0 0 0 2px rgba(255, 255, 255, 0.08),
                0 20px 60px rgba(0, 0, 0, 0.6),
                inset 0 -10px 40px rgba(0, 0, 0, 0.35);
            animation: phone-float 6s ease-in-out infinite;
        }

        @keyframes phone-float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        .phone::before {
            content: "";
            position: absolute;
            inset: 8px;
            border-radius: 38px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            pointer-events: none;
        }

        .side-btn {
            position: absolute;
            left: -8px;
            width: 6px;
            border-radius: 6px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.15), rgba(0, 0, 0, 0.3));
            z-index: 2;
        }
        .side-btn.top {
            top: 140px;
            height: 100px;
        }
        .side-btn.bottom {
            top: 280px;
            height: 70px;
        }

        .screen {
            width: 100%;
            height: 100%;
            border-radius: 32px;
            background: linear-gradient(180deg, #0d1627 0%, #0f1a30 100%);
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
        }

        .notch {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 28px;
            background: #0b0f1a;
            border-radius: 20px;
            z-index: 3;
        }

        .content {
            position: relative;
            z-index: 2;
            height: 100%;
            padding: 70px 24px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        /* ── 顶部 Logo 区域 ──────────────────────── */
        .splash-center {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            animation: fade-in-up 0.8s var(--transition-ease) both;
        }

        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            width: 130px;
            height: 130px;
            animation: logo-pulse 3s ease-in-out infinite;
            filter: drop-shadow(0 0 12px rgba(56, 213, 193, 0.4));
        }

        @keyframes logo-pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .brand {
            font-size: 38px;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: #f3f6fb;
            text-shadow: 0 0 20px rgba(56, 213, 193, 0.3);
            animation: text-glow 2s ease-in-out infinite alternate;
        }

        @keyframes text-glow {
            from {
                text-shadow: 0 0 10px rgba(56, 213, 193, 0.2);
            }
            to {
                text-shadow: 0 0 24px rgba(56, 213, 193, 0.5);
            }
        }

        .slogan {
            font-size: 18px;
            color: #b9c7de;
            letter-spacing: 0.4px;
            animation: fade-in-up 0.8s 0.2s var(--transition-ease) both;
        }

        /* 漂浮元素粒子 */
        .particles-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        .floating-element {
            position: absolute;
            font-size: 14px;
            font-weight: 700;
            color: rgba(56, 213, 193, 0.25);
            animation: float-around 8s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .floating-element svg {
            opacity: 0.7;
        }
        .floating-element:nth-child(1) {
            top: 20%;
            left: 10%;
            animation-delay: 0s;
            font-size: 16px;
        }
        .floating-element:nth-child(2) {
            top: 10%;
            right: 15%;
            animation-delay: 1.5s;
            font-size: 12px;
            color: rgba(183, 241, 113, 0.3);
        }
        .floating-element:nth-child(3) {
            bottom: 25%;
            left: 8%;
            animation-delay: 3s;
            font-size: 18px;
            color: rgba(246, 179, 85, 0.25);
        }
        .floating-element:nth-child(4) {
            bottom: 15%;
            right: 10%;
            animation-delay: 4.5s;
            font-size: 14px;
        }
        .floating-element:nth-child(5) {
            top: 60%;
            left: 50%;
            animation-delay: 2s;
            font-size: 10px;
            color: rgba(56, 213, 193, 0.2);
        }

        @keyframes float-around {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(15px, -25px) rotate(5deg);
            }
            50% {
                transform: translate(-10px, -15px) rotate(-3deg);
            }
            75% {
                transform: translate(-20px, 10px) rotate(2deg);
            }
            100% {
                transform: translate(0, 0) rotate(0deg);
            }
        }

        /* ── 底部信息 ────────────────────────────── */
        .splash-foot {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            animation: fade-in-up 0.8s 0.4s var(--transition-ease) both;
        }

        .pill {
            padding: 8px 18px;
            border-radius: 999px;
            background: rgba(56, 213, 193, 0.15);
            color: #bff7ef;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.04em;
            border: 1px solid rgba(56, 213, 193, 0.3);
        }

        .small-note {
            font-size: 12px;
            color: #8493a8;
            letter-spacing: 0.06em;
        }

        /* ── 响应式调整 ──────────────────────────── */
        @media (max-width: 440px) {
            .phone {
                width: 92vw;
                height: auto;
                aspect-ratio: 390 / 780;
                border-radius: 32px;
                padding: 10px;
            }
            .screen {
                border-radius: 24px;
            }
            .brand {
                font-size: 32px;
            }
            .slogan {
                font-size: 15px;
            }
            .logo {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="phone">
        <div class="side-btn top"></div>
        <div class="side-btn bottom"></div>
        <div class="screen">
            <div class="notch"></div>
            <div class="content">
                <!-- 漂浮化学元素 -->
                <div class="particles-container">
                    <span class="floating-element"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(0 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"/></svg></span>
                    <span class="floating-element">C₆H₆</span>
                    <span class="floating-element"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="6" x2="19" y2="6"/><line x1="5" y1="12" x2="19" y2="12"/><line x1="5" y1="18" x2="19" y2="18"/></svg></span>
                    <span class="floating-element">OH</span>
                    <span class="floating-element"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/></svg></span>
                </div>

                <!-- 主视觉区 -->
                <div class="splash-center">
                    <svg class="logo" viewBox="0 0 120 120" aria-hidden="true">
                        <defs>
                            <linearGradient id="logoGlow" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0%" stop-color="#38d5c1" />
                                <stop offset="100%" stop-color="#b7f171" />
                            </linearGradient>
                        </defs>
                        <polygon points="60,8 108,34 108,86 60,112 12,86 12,34"
                        fill="none" stroke="url(#logoGlow)" stroke-width="5" />
                        <circle cx="60" cy="60" r="18" fill="none" stroke="#f6b355" stroke-width="4" />
                        <path d="M38 68 L20 82" stroke="#b7f171" stroke-width="4" stroke-linecap="round" />
                        <path d="M82 52 L102 40" stroke="#38d5c1" stroke-width="4" stroke-linecap="round" />
                    </svg>
                    <div class="brand">ChemVISION</div>
                    <div class="slogan">能说化学，更能画化学</div>
                </div>

                <!-- 底部信息 -->
                <div class="splash-foot">
                    <div class="pill">BlueLM · 端云协同</div>
                    <div class="small-note">vivo AIGC 创新赛 · 初赛演示</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
