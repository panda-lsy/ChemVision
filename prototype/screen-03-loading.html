<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>ChemVISION - 加载动效</title>
  <link rel="stylesheet" href="common.css" />
  <style>
    :root {
            --ink:#0b0f1a; --navy:#0f172a; --navy-2:#101a2b;
            --aqua:#38d5c1; --lime:#b7f171; --amber:#f6b355;
            --mist:#e9eef5; --soft:#cdd6e5;
            --glass:rgba(255,255,255,0.08); --glass-strong:rgba(255,255,255,0.12);
            --shadow:rgba(5,12,24,0.45); --transition-ease:cubic-bezier(0.4,0,0.2,1);
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;font-family:'Space Grotesk','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden}

    /* ── 加载页专用补充样式 ──────────────────────────── */
    .loader-page .pill { font-size: 12px; font-weight: 500; }
    
    body {
      font-family: 'Space Grotesk', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }

    .loader {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* 分子结构容器 */
    .molecule-wrap {
      position: relative;
      width: 230px;
      height: 190px;
      margin: 0 auto 6px;
    }

    /* 光环背景 */
    .glow-ring-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 170px;
      height: 170px;
      margin: -85px 0 0 -85px;
      border-radius: 50%;
      border: 2px solid rgba(56, 213, 193, 0.1);
      opacity: 0;
      animation: ringPulse 2.8s ease-in-out infinite;
      transition: opacity 0.8s ease;
    }
    .glow-ring-bg.visible { opacity: 1; }

    @keyframes ringPulse {
      0%, 100% { transform: scale(1); border-color: rgba(56, 213, 193, 0.08); }
      50% { transform: scale(1.1); border-color: rgba(56, 213, 193, 0.22); }
    }

    .top-bar { display:flex; align-items:center; justify-content:space-between; }
        .brand-small { font-size:16px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--mist); }
        .pill { padding:8px 16px; border-radius:999px; background:rgba(56,213,193,0.15); color:#bff7ef; font-size:12px; font-weight:500; letter-spacing:0.04em; border:1px solid rgba(56,213,193,0.3); box-shadow:0 0 12px rgba(56,213,193,0.15); animation:pill-glow 2s ease-in-out infinite alternate; }
        @keyframes pill-glow { from{box-shadow:0 0 8px rgba(56,213,193,0.1)} to{box-shadow:0 0 18px rgba(56,213,193,0.3)} }

        h1 { font-size:34px; font-weight:600; letter-spacing:0.03em; color:#f3f6fb; margin:0; text-shadow:0 0 20px rgba(56,213,193,0.3); }

    /* 轨道粒子层 */
    .orbit-layer {
      position: absolute;
      inset: -30px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1s ease;
    }
    .orbit-layer.visible { opacity: 1; }

    .orbital {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      margin: -2.5px 0 0 -2.5px;
    }
    .orbital::after {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: inherit;
      opacity: 0.25;
      filter: blur(4px);
    }
    .orbital:nth-child(1) {
      background: var(--aqua);
      animation: orbit1 3.4s linear infinite;
    }
    .orbital:nth-child(2) {
      background: var(--lime);
      animation: orbit2 4.8s linear infinite;
      width: 4px; height: 4px;
    }
    .orbital:nth-child(3) {
      background: var(--amber);
      animation: orbit3 6s linear infinite;
      width: 3px; height: 3px;
    }
    .orbital:nth-child(4) {
      background: #9bc4ff;
      animation: orbit4 4s linear infinite reverse;
      width: 4px; height: 4px;
    }

    @keyframes orbit1 {
      from { transform: rotate(0deg) translateX(98px) rotate(0deg); }
      to   { transform: rotate(360deg) translateX(98px) rotate(-360deg); }
    }
    @keyframes orbit2 {
      from { transform: rotate(90deg) translateX(112px) rotate(-90deg); }
      to   { transform: rotate(450deg) translateX(112px) rotate(-450deg); }
    }
    @keyframes orbit3 {
      from { transform: rotate(200deg) translateX(82px) rotate(-200deg); }
      to   { transform: rotate(560deg) translateX(82px) rotate(-560deg); }
    }
    @keyframes orbit4 {
      from { transform: rotate(310deg) translateX(108px) rotate(-310deg); }
      to   { transform: rotate(670deg) translateX(108px) rotate(-670deg); }
    }

    /* SmilesDrawer 渲染目标 */
    #molecule-svg {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      opacity: 0;
    }

    #molecule-svg.reveal {
      animation: molReveal 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    #molecule-svg.float {
      animation: molFloat 4.5s ease-in-out infinite;
    }

    @keyframes molReveal {
      0% {
        opacity: 0;
        transform: scale(0.2) rotate(-14deg);
        filter: blur(14px) drop-shadow(0 0 0 rgba(56,213,193,0));
      }
      30% {
        opacity: 0.65;
        transform: scale(1.08) rotate(3deg);
        filter: blur(3px) drop-shadow(0 0 28px rgba(56,213,193,0.95));
      }
      60% {
        opacity: 1;
        transform: scale(0.96) rotate(-1deg);
        filter: blur(0) drop-shadow(0 0 16px rgba(56,213,193,0.5));
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0);
        filter: blur(0) drop-shadow(0 0 10px rgba(56,213,193,0.35));
      }
    }

    @keyframes molFloat {
      0%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
      70% { transform: translateY(4px); }
    }

    /* 漂浮化学图标粒子 */
    .particles-layer {
      position: absolute;
      inset: -24px;
      pointer-events: none;
      z-index: 3;
    }
    .particle-icon {
      position: absolute;
      animation: pFloat 5.5s ease-in-out infinite;
      opacity: 0.45;
    }
    .particle-icon:nth-child(1) { top: 8%;  left: -2%;  animation-delay: 0s; }
    .particle-icon:nth-child(2) { top: -4%; right: 4%;  animation-delay: 1.1s; }
    .particle-icon:nth-child(3) { bottom: 12%; left: 0;  animation-delay: 2.3s; }
    .particle-icon:nth-child(4) { bottom: 0;  right: 6%; animation-delay: 3.5s; }
    .particle-icon:nth-child(5) { top: 48%;  right: -6%; animation-delay: 1.7s; }
    .particle-icon:nth-child(6) { top: 62%;  left: -6%; animation-delay: 2.9s; }

    @keyframes pFloat {
      0%, 100% { transform: translateY(0) translateX(0) scale(1);    opacity: 0.25; }
      18% { transform: translateY(-15px) translateX(5px) scale(1.2); opacity: 0.6; }
      38% { transform: translateY(-5px) translateX(-7px) scale(0.9); opacity: 0.35; }
      58% { transform: translateY(-18px) translateX(3px) scale(1.12);opacity: 0.55; }
      78% { transform: translateY(-3px) translateX(-4px) scale(1.04);opacity: 0.4; }
    }

    /* 阶段指示器 SVG 图标过渡 */
    .stage-dot svg {
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    .stage-dot.active svg { transform: scale(1.15); }
    .stage-dot.done svg   { opacity: 0.75; }

    /* 阶段指示器均分对齐 */
    #stageIndicator {
      width: 100%;
      justify-content: space-between;
      gap: 0;
      text-align: center;
    }

    /* 阶段标签均分 */
    .stage-labels {
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 2px;
    }
    .stage-labels span {
      flex: 1;
      text-align: center;
      transition: all 0.4s ease;
    }

    /* SMILES 文字 */
    .smiles-display {
      min-height: 20px;
      font-family: 'Space Grotesk', 'Courier New', monospace;
      font-size: 13px;
      color: var(--aqua);
      letter-spacing: 0.5px;
      text-align: center;
      opacity: 0;
      transform: translateY(6px);
      transition: all 0.35s ease;
      word-break: break-all;
    }
    .smiles-display.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* 加载进度点 */
    .progress-dots {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 2px;
    }
    .progress-dots .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(56, 213, 193, 0.35);
      animation: dotBounce 1.4s ease-in-out infinite;
    }
    .progress-dots .dot:nth-child(2) { animation-delay: 0.2s; }
    .progress-dots .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotBounce {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.25; }
      40% { transform: scale(1.35); opacity: 1; }
    }
  </style>
</head>
<body class="loader-page">
  <div class="canvas">
    <div class="phone">
      <div class="side-btn top"></div>
      <div class="side-btn bottom"></div>
      <div class="screen">
        <div class="notch"></div>
        <div class="content">
          <!-- 顶部栏 -->
          <div class="top-bar">
            <div class="brand-small">ChemVISION</div>
            <div class="pill ghost" id="statusPill">结构推理中</div>
          </div>

          <!-- 加载主体 -->
          <div class="loader">
            <!-- 分子结构展示区 -->
            <div class="molecule-wrap">
              <div class="glow-ring-bg" id="glowRing"></div>
              <div class="orbit-layer" id="orbitLayer">
                <span class="orbital"></span>
                <span class="orbital"></span>
                <span class="orbital"></span>
                <span class="orbital"></span>
              </div>
              <!-- 漂浮化学图标 -->
              <div class="particles-layer">
                <span class="particle-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(56,213,193,0.55)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4m-8.49-2.51 2.83-2.83m11.32-11.32 2.83-2.83M2 12h4m12 0h4M4.51 19.49l2.83-2.83M16.66 7.34l2.83-2.83"/></svg></span>
                <span class="particle-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(183,241,113,0.55)" stroke-width="2" stroke-linecap="round"><path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/></svg></span>
                <span class="particle-icon"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="rgba(246,179,85,0.55)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></span>
                <span class="particle-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(160,210,240,0.45)" stroke-width="2" stroke-linecap="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg></span>
                <span class="particle-icon"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="rgba(56,213,193,0.45)" stroke-width="2" stroke-linecap="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></span>
                <span class="particle-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(155,196,255,0.45)" stroke-width="2" stroke-linecap="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26"/></svg></span>
              </div>
              <!-- SmilesDrawer 渲染目标 -->
              <svg id="molecule-svg" viewBox="0 0 230 190" aria-hidden="true"></svg>
            </div>

            <div class="loading-text" id="loadingText">正在解析…</div>
            <div class="subtle" id="subtleText">端侧意图识别 · 延迟 &lt;100ms</div>

            <!-- 阶段指示器 -->
            <div class="stage-indicator" id="stageIndicator">
              <div class="stage-dot active" data-stage="0">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              </div>
              <div class="stage-connector" data-conn="0"></div>
              <div class="stage-dot" data-stage="1">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4m-7.07-3.93 2.83-2.83m8.48-8.48 2.83-2.83M2 12h4m12 0h4m-3.93 7.07-2.83-2.83M6.76 6.76 3.93 3.93"/></svg>
              </div>
              <div class="stage-connector" data-conn="1"></div>
              <div class="stage-dot" data-stage="2">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
              </div>
              <div class="stage-connector" data-conn="2"></div>
              <div class="stage-dot" data-stage="3">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
              </div>
            </div>
            <div class="stage-labels" id="stageLabels">
              <span data-label="0" class="highlight">意图识别</span>
              <span data-label="1">结构推理</span>
              <span data-label="2">规则校验</span>
              <span data-label="3">渲染输出</span>
            </div>

            <div class="smiles-display" id="smilesDisplay"></div>

            <div class="progress-dots">
              <div class="dot"></div>
              <div class="dot"></div>
              <div class="dot"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/smiles-drawer@2.0.1/dist/smiles-drawer.min.js"></script>
  <script>
    (function () {
      var stages = [
        { statusText: '意图识别中…',  pillText: '端侧 BlueLM', subtle: '端侧路由 · 延迟 <100ms' },
        { statusText: 'SMILES 生成中…', pillText: '结构推理中',  subtle: '云端 BlueLM API · 命名解析 → SMILES' },
        { statusText: '规则校验中…',  pillText: '规则校验中',  subtle: 'RDKit 校验层 · 价态/键合法性验证' },
        { statusText: '渲染输出中…',  pillText: '渲染输出中',  subtle: 'SVG 键线式图 · 分子属性计算' }
      ];

      var smilesString = 'O=C(O)c1ccccc1';
      var currentStage = 0;
      var stageDuration = 2500;
      var smilesTimer = null;
      var charIndex = 0;
      var moleculeDrawn = false;

      var statusPill    = document.getElementById('statusPill');
      var loadingText   = document.getElementById('loadingText');
      var subtleText    = document.getElementById('subtleText');
      var smilesDisplay = document.getElementById('smilesDisplay');
      var moleculeSvg   = document.getElementById('molecule-svg');
      var glowRing      = document.getElementById('glowRing');
      var orbitLayer    = document.getElementById('orbitLayer');
      var stageDots        = document.querySelectorAll('.stage-dot');
      var stageConnectors  = document.querySelectorAll('.stage-connector');
      var stageLabelSpans  = document.querySelectorAll('#stageLabels span');

      /* SmilesDrawer 配色（与 Page4/Page5 统一） */
      var theme = {
        C: '#e8f6f3', O: '#f6b355', N: '#9bc4ff', S: '#ffd166',
        F: '#b7f171', Cl: '#9cd1ff', Br: '#f4a6c8', I: '#cda2ff',
        P: '#f6d365', B: '#9ee493', Si: '#c5d1ff'
      };

      function resetMolecule() {
        moleculeSvg.classList.remove('reveal', 'float');
        moleculeSvg.style.opacity = '0';
        moleculeSvg.style.transform = '';
        moleculeSvg.style.filter = '';
        orbitLayer.classList.remove('visible');
        glowRing.classList.remove('visible');
        moleculeDrawn = false;
      }

      function drawMolecule() {
        if (moleculeDrawn || !window.SmilesDrawer) return;
        moleculeDrawn = true;
        var drawer = new SmilesDrawer.SvgDrawer({
          width: 210, height: 170, padding: 12,
          bondThickness: 2, bondLength: 16,
          atomVisualization: 'default',
          themes: { custom: theme }
        });
        SmilesDrawer.parse(smilesString, function (tree) {
          drawer.draw(tree, 'molecule-svg', 'custom', false);
          requestAnimationFrame(function () {
            moleculeSvg.classList.add('reveal');
            moleculeSvg.addEventListener('animationend', function () {
              moleculeSvg.classList.remove('reveal');
              moleculeSvg.style.opacity = '1';
              moleculeSvg.style.transform = '';
              moleculeSvg.style.filter = '';
              moleculeSvg.classList.add('float');
            }, { once: true });
          });
          setTimeout(function () {
            orbitLayer.classList.add('visible');
            glowRing.classList.add('visible');
          }, 500);
        }, function () {});
      }

      function updateStageIndicator(stage) {
        stageDots.forEach(function (dot, i) {
          dot.classList.remove('active', 'done');
          if (i < stage) dot.classList.add('done');
          if (i === stage) dot.classList.add('active');
        });
        stageConnectors.forEach(function (conn, i) {
          conn.classList.toggle('done', i < stage);
        });
        stageLabelSpans.forEach(function (span, i) {
          span.classList.toggle('highlight', i === stage);
        });
      }

      function clearSmiles() {
        if (smilesTimer) clearInterval(smilesTimer);
        smilesTimer = null;
        charIndex = 0;
        smilesDisplay.textContent = '';
        smilesDisplay.classList.remove('visible');
      }

      function startSmilesTyping() {
        clearSmiles();
        smilesDisplay.classList.add('visible');
        smilesTimer = setInterval(function () {
          if (charIndex < smilesString.length) {
            charIndex++;
            smilesDisplay.textContent = smilesString.substring(0, charIndex);
          } else {
            clearInterval(smilesTimer);
            smilesTimer = null;
          }
        }, 55);
      }

      function switchToStage(stage) {
        currentStage = stage;
        var s = stages[stage];
        loadingText.textContent  = s.statusText;
        subtleText.textContent   = s.subtle;
        statusPill.textContent   = s.pillText;
        updateStageIndicator(stage);

        if (stage === 1) {
          startSmilesTyping();
        } else if (stage === 0) {
          clearSmiles();
          resetMolecule();
        } else if (stage >= 2) {
          if (smilesTimer) { clearInterval(smilesTimer); smilesTimer = null; }
          smilesDisplay.textContent = smilesString;
          smilesDisplay.classList.add('visible');
        }

        if (stage === 2) drawMolecule();
      }

      function nextStage() {
        switchToStage((currentStage + 1) % stages.length);
      }

      switchToStage(0);
      setInterval(nextStage, stageDuration);
      document.querySelector('.screen').addEventListener('click', nextStage);
    })();
  </script>
</body>
</html>
