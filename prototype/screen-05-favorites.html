<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChemVISION - 收藏与错题本</title>
  <link rel="stylesheet" href="common.css" />
</head>
<body>
  <div class="canvas">
    <div class="bg"></div>
    <div class="phone">
      <div class="side-btn top"></div>
      <div class="side-btn bottom"></div>
      <div class="screen">
        <div class="notch"></div>
        <div class="content">
          <div class="top-bar">
            <div class="brand-small">ChemVISION</div>
            <div class="pill">收藏 / 错题本</div>
          </div>
          <h1>我的结构卡片</h1>
          <div class="chip-row">
            <div class="chip active">全部</div>
            <div class="chip">错题</div>
            <div class="chip">芳香族</div>
            <div class="chip">羧酸</div>
          </div>
          <div class="list">
            <div class="list-card">
              <div class="structure">
                <svg class="molecule-card" viewBox="0 0 200 160" aria-hidden="true">
                  <polygon points="100,18 168,58 168,122 100,152 32,122 32,58" />
                  <line x1="100" y1="18" x2="100" y2="152" />
                  <line x1="32" y1="58" x2="168" y2="122" />
                </svg>
              </div>
              <div>
                <h3>苯甲酸</h3>
                <div class="meta-row">C7H6O2 · 分子量 122.12</div>
                <div class="chip-row">
                  <div class="chip">芳香族</div>
                  <div class="chip">羧酸</div>
                </div>
              </div>
            </div>
            <div class="list-card">
              <div class="structure">
                <svg class="molecule-card" viewBox="0 0 200 160" aria-hidden="true">
                  <line x1="30" y1="80" x2="170" y2="80" />
                  <line x1="60" y1="50" x2="140" y2="110" />
                </svg>
              </div>
              <div>
                <h3>2-甲基-3-乙基戊烷</h3>
                <div class="meta-row">C8H18 · 分子量 114.23</div>
                <div class="chip-row">
                  <div class="chip">烷烃</div>
                  <div class="chip">错题</div>
                </div>
              </div>
            </div>
            <div class="list-card">
              <div class="structure">
                <svg class="molecule-card" viewBox="0 0 200 160" aria-hidden="true">
                  <polygon points="100,18 168,58 168,122 100,152 32,122 32,58" />
                  <line x1="168" y1="58" x2="190" y2="40" />
                  <line x1="190" y1="40" x2="196" y2="14" />
                </svg>
              </div>
              <div>
                <h3>对硝基苯胺</h3>
                <div class="meta-row">C6H6N2O2 · 分子量 138.12</div>
                <div class="chip-row">
                  <div class="chip">芳香族</div>
                  <div class="chip">考试重点</div>
                </div>
              </div>
            </div>
          </div>
          <div class="card">
            <div class="subtle">长按卡片可添加笔记与知识点标签。</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
