<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="130" height="130">
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38d5c1" />
      <stop offset="100%" stop-color="#b7f171" />
    </linearGradient>
  </defs>
  <!-- 六边形（苯环） -->
  <polygon points="60,8 108,34 108,86 60,112 12,86 12,34"
