// 仿 Ketcher 官方 getSvgFromDrawnStructures：以 window.ketcher.editor.canvas 为根，
// 克隆出干净的结构 SVG（去掉 selection-area、dynamic-element、覆盖整幅画布的背景 rect），
// 再按所选 bgColor 调整“墨水”描边色，避免黑线在深色 PNG 上不可见、或在浅色 PNG 上变白线。
function _cvFindCanvasSvg() {
  try {
    var k = window.ketcher;
    if (k && k.editor && k.editor.canvas && k.editor.canvas.tagName.toUpperCase() === 'SVG') {
      return k.editor.canvas;
    }
  } catch (e) {}
  var drawn = document.querySelector('g.drawn-structures, .drawn-structures');
  if (drawn) { var svg = drawn.closest('svg'); if (svg) return svg; }
  return document.querySelector('svg.drawn-structures')
    || document.querySelector('.intermediate-canvas svg')
    || document.querySelector('.cliparea svg')
    || document.querySelector('[class*="StructEditor"] svg');
}

// 解析 #rrggbb 颜色的相对亮度（粗略 0~1），用于按 bgColor 选择描边明/暗
function _cvLuminance(hex) {
  if (!hex || hex === 'transparent') return null;
  var m = String(hex).match(/^#?([0-9a-fA-F]{6})$/);
  if (!m) return null;
  var r = parseInt(m[1].slice(0,2),16), g = parseInt(m[1].slice(2,4),16), b = parseInt(m[1].slice(4,6),16);
  return (0.2126*r + 0.7152*g + 0.0722*b) / 255;
}

// 按所选 bgColor 决定墨水描边色：透明跟随当前 iframe 主题；浅色底→黑墨；深色底→浅墨
function _cvTargetStroke(bg) {
  var isDarkIframe = document.documentElement.getAttribute('data-theme') === 'dark';
  if (!bg || bg === 'transparent') return isDarkIframe ? '#e9eef5' : '#000';
  var L = _cvLuminance(bg);
  if (L === null) return '#000';
  return L > 0.5 ? '#000' : '#e9eef5';
}

// 把 wrapper SVG 内的“墨水”色（#000 / black / #e9eef5 / #fff / white）替换为 target
function _cvApplyInkColor(node, target) {
  var inks = ['#000', '#000000', 'black', '#e9eef5', '#fff', '#ffffff', 'white'];
  function isInk(v) { return v && inks.indexOf(String(v).toLowerCase()) >= 0; }
  node.querySelectorAll('[stroke]').forEach(function(el){ if (isInk(el.getAttribute('stroke'))) el.setAttribute('stroke', target); });
  node.querySelectorAll('[fill]').forEach(function(el){ var f=el.getAttribute('fill'); if (isInk(f)) el.setAttribute('fill', target); });
  node.querySelectorAll('[style]').forEach(function(el){
    var st = el.getAttribute('style') || '';
    if (!/#[0-9a-fA-F]{3,6}|black|white/.test(st)) return;
    var ns = st
      .replace(/stroke:\s*#000(?:000)?\b/g, 'stroke: '+target)
      .replace(/stroke:\s*black\b/g, 'stroke: '+target)
      .replace(/stroke:\s*#fff(?:fff)?\b/g, 'stroke: '+target)
      .replace(/stroke:\s*white\b/g, 'stroke: '+target)
      .replace(/fill:\s*#000(?:000)?\b/g, 'fill: '+target)
      .replace(/fill:\s*black\b/g, 'fill: '+target);
    el.setAttribute('style', ns);
  });
}

// 构造用于导出的干净 SVG 字符串；返回 {svg, width, height}，svg 始终是裸 SVG 文本
function _cvBuildExportSvg(bg) {
  var canvas = _cvFindCanvasSvg();
  if (!canvas) return null;
  var inner = canvas.innerHTML || '';
  var wrapper = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  wrapper.innerHTML = inner;
  try { if (wrapper.querySelector('#rectangle-selection-area')) wrapper.querySelector('#rectangle-selection-area').remove(); } catch (e) {}
  var dyn = wrapper.querySelectorAll('.dynamic-element, [class*="dynamic-element"]');
  if (dyn && dyn.forEach) dyn.forEach(function(el){ el.remove(); });
  // 去掉整幅画布的背景 rect：与画布等宽/或 100% 的 rect
  var vbParts = (canvas.getAttribute('viewBox') || '').split(/\s+/).map(Number);
  var cw = vbParts[2], ch = vbParts[3];
  wrapper.querySelectorAll('rect').forEach(function(r){
    var w = r.getAttribute('width'), h = r.getAttribute('height');
    var wn = parseFloat(w || ''), hn = parseFloat(h || '');
    var cover = (w === '100%' && h === '100%')
      || (!isNaN(wn) && !isNaN(hn) && cw && ch && wn >= cw - 0.5 && hn >= ch - 0.5);
    if (cover) r.remove();
  });
  try { wrapper.querySelectorAll('text').forEach(function(el){ el.setAttribute('cursor','default'); }); } catch(e) {}
  try { wrapper.querySelectorAll('g').forEach(function(el){ if (el.hasAttribute('opacity')) el.removeAttribute('opacity'); }); } catch(e) {}
  _cvApplyInkColor(wrapper, _cvTargetStroke(bg));

  // 紧凑 viewBox：取 .drawn-structures 的 boundingRect
  var drawnEl = null;
  try { drawnEl = canvas.getElementsByClassName('drawn-structures')[0] || canvas.querySelector('.drawn-structures'); } catch(e) {}
  var rect = null;
  try { rect = drawnEl ? drawnEl.getBoundingClientRect() : null; } catch(e) {}
  if (!rect || !rect.width || !rect.height) { return null; }
  var mL = 50, mT = 54, mH = 10, mV = 10;
  var vbX = rect.x - mL - mH, vbY = rect.y - mT - mV, vbW = rect.width + mH*2, vbH = rect.height + mV*2;
  var innerOut = wrapper.innerHTML || inner;
  innerOut = innerOut.replace(/\bcursor:\s*pointer;\s*/g, '');
  // 注入中文字体，避免乱码（字符串级替换，绕开 DOM 重复属性）
  innerOut = innerOut.replace(/font-family="[^"]*"/g, "font-family=\"'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif\"");
  var s = "<svg xmlns='http://www.w3.org/2000/svg' width='" + vbW + "' height='" + vbH + "' viewBox='" + vbX + " " + vbY + " " + vbW + " " + vbH + "'>" + innerOut + "</svg>";
  return { svg: s, width: vbW, height: vbH };
}

window._cvExportSvg = function(bg) {
  var built = _cvBuildExportSvg(bg || 'transparent');
  if (!built || !built.svg) return null;
  try {
    return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(built.svg)));
  } catch (e) {
    return built.svg; // 退化返回裸 SVG 文本，由 Dart 端兜底包装
  }
};

window._cvExportPng = function(bg) {
  return new Promise(function(resolve) {
    var built = _cvBuildExportSvg(bg || 'transparent');
    if (!built || !built.svg) { resolve(null); return; }
    var blob = new Blob([built.svg], { type: 'image/svg+xml;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var img = new Image();
    img.onload = function() {
      var w = Math.max(1, Math.round(built.width));
      var h = Math.max(1, Math.round(built.height));
      var scale = 2;
      var canvas = document.createElement('canvas');
      canvas.width = w * scale; canvas.height = h * scale;
      var ctx = canvas.getContext('2d');
      ctx.scale(scale, scale);
      if (bg && bg !== 'transparent') { ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h); }
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/png'));
      URL.revokeObjectURL(url);
    };
    img.onerror = function() { resolve(null); URL.revokeObjectURL(url); };
    img.src = url;
  });
};

window.addEventListener('message', function(e) {
  var d = e && e.data;
  if (!d || !d.channel || !d.type) return;
  try {
    if (d.type === 'exportSvg') {
      var bg = (d.payload && d.payload.data) || 'transparent';
      var url = window._cvExportSvg(bg);
      window.parent.postMessage({channel:d.channel,type:'exportSvgResult',payload:{svgString:url}}, '*');
    } else if (d.type === 'exportPng') {
      var bg = (d.payload && d.payload.data) || '#ffffff';
      window._cvExportPng(bg).then(function(url) {
        window.parent.postMessage({channel:d.channel,type:'exportPngResult',payload:{dataUrl:url}}, '*');
      });
    }
  } catch(ex) {
    window.parent.postMessage({channel:d.channel,type:d.type==='exportSvg'?'exportSvgResult':'exportPngResult',payload:{dataUrl:null}}, '*');
  }
});

/* ======== 2. 触摸鼠标转发 + 双指缩放 ======== */ + 双指缩放 ======== */
var _pinchActive=false,_pinchDist0=0,_touching=false;

function isInteractive(el){
  return !!el.closest('[class*="Toolbar"],[class*="toolbar"],[class*="Modal"],[class*="Dialog"],[class*="Popover"],[class*="ContextMenu"],[class*="Tooltip"],button,select,input,textarea,a[href],[role="button"]');
}

function dispatchMouse(type,t){
  var el=document.elementFromPoint(t.clientX,t.clientY);
  if(!el)return;
  try{el.dispatchEvent(new MouseEvent(type,{bubbles:true,cancelable:true,view:window,clientX:t.clientX,clientY:t.clientY,button:0,buttons:type==='mouseup'?0:1}));}catch(e){}
}

function dispatchWheel(deltaY,cx,cy){
  var el=document.elementFromPoint(cx,cy);
  if(!el)return;
  try{el.dispatchEvent(new WheelEvent('wheel',{bubbles:true,cancelable:true,view:window,deltaX:0,deltaY:deltaY,deltaZ:0,deltaMode:0,clientX:cx,clientY:cy,ctrlKey:true}));}catch(e){}
}

document.addEventListener('touchstart',function(e){
  if(e.touches.length===2){
    var t0=e.touches[0],t1=e.touches[1];
    _pinchActive=true;
    _pinchDist0=Math.hypot(t1.clientX-t0.clientX,t1.clientY-t0.clientY);
    if(_touching){dispatchMouse('mouseup',t0);_touching=false;}
    e.preventDefault();
    return;
  }
  if(e.touches.length!==1||_pinchActive)return;
  if(isInteractive(e.target))return;
  _touching=true;
  e.preventDefault();
  dispatchMouse('mousedown',e.touches[0]);
},{passive:false});

document.addEventListener('touchmove',function(e){
  if(_pinchActive&&e.touches.length===2){
    e.preventDefault();
    var t0=e.touches[0],t1=e.touches[1];
    var dist=Math.hypot(t1.clientX-t0.clientX,t1.clientY-t0.clientY);
    var scale=dist/_pinchDist0;
    var deltaY=(1-scale)*120;
    var cx=(t0.clientX+t1.clientX)/2,cy=(t0.clientY+t1.clientY)/2;
    dispatchWheel(deltaY,cx,cy);
    _pinchDist0=dist;
    return;
  }
  if(!_touching||e.touches.length!==1)return;
  e.preventDefault();
  dispatchMouse('mousemove',e.touches[0]);
},{passive:false});

document.addEventListener('touchend',function(e){
  if(_pinchActive&&e.touches.length<2){_pinchActive=false;return;}
  if(!_touching)return;
  _touching=false;
  e.preventDefault();
  dispatchMouse('mouseup',e.changedTouches[0]);
},{passive:false});
document.addEventListener('touchcancel',function(){_touching=false;_pinchActive=false;});

/* ======== 3. 抑制 cliparea 触发输入法 ======== */
function neutClip(){
  var el=document.querySelector('.cliparea');
  if(!el||el.getAttribute('data-cv-clip'))return;
  try{el.readOnly=true;}catch(e){}
  try{el.setAttribute('contenteditable','false');}catch(e){}
  try{el.setAttribute('inputmode','none');}catch(e){}
  el.setAttribute('data-cv-clip','1');
}
neutClip();
new MutationObserver(function(){neutClip();}).observe(document.documentElement,{childList:true,subtree:true});

/* ======== 5. force toolbar scrolling (inline style, overrides React) ======== */
function applyToolbarScroll() {
  var els = document.querySelectorAll(
    '[data-testid="top-toolbar"],[data-testid="bottom-toolbar"],' +
    '[data-testid="top-toolbar"],[data-testid="bottom-toolbar"],' +
    '[class*="ArrowScroll"]'
  );
  els.forEach(function(el) {
    if (!el.getAttribute('data-cv-scroll')) {
      el.style.setProperty('overflow-x', 'scroll', 'important');
      el.style.setProperty('overflow-y', 'hidden', 'important');
      el.style.setProperty('-webkit-overflow-scrolling', 'touch', 'important');
      el.setAttribute('data-cv-scroll', '1');
    }
  });
}
// Run after React renders, then watch for new toolbars
setTimeout(applyToolbarScroll, 600);
setTimeout(applyToolbarScroll, 2000);
new MutationObserver(function() { applyToolbarScroll(); })
  .observe(document.documentElement, { childList: true, subtree: true });
})();</script></body></html>
